# Blackjack Pipeline Configuration
#
# Blackjack basic strategy controller.
# The controller implements optimal hit/stand decisions based on:
# - Player's hand value (4-21)
# - Dealer's visible card (2-11, where 11=Ace)
# - Whether the hand is soft (contains usable Ace)

name: blackjack

synthesis:
  command: issy
  args:
    - "--tslmt"
    - "--synt"
  timeout_minutes: 5

debug: true

run_configuration:
  - name: "Basic strategy test"
    # No additional params needed for blackjack
    objectives:
      # Objective: Correct basic strategy decisions
      - objective: "G (shouldHitCondition -> hit) && G (!shouldHitCondition -> stand)"
        timeout: 100

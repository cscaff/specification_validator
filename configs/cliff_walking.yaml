# Cliff Walking Pipeline Configuration
#
# Robot navigates a grid, avoiding a cliff to reach the goal.
# Based on the OpenAI Gymnasium Cliff Walking environment.

name: cliff_walking

synthesis:
  command: issy
  args:
    - "--tslmt"
    - "--synt"
    # - "--pruning"
    # - "1"

  timeout_minutes: 10  # Skip configuration if synthesis takes longer than 5 minutes

debug: true

run_configuration:
  # Objective: Reach goal while avoiding cliff
  - objective: "F (eq x goalX && eq y goalY) && (G (X (eq y goalY -> eq x goalX)))"
    timeout: 1000
    configurations:
      - name: "Standard 12x4 cliff"
        grid_size: 12
        grid_rows: 4
        cliff_min: 1
        cliff_max: 10
        start_pos: {x: 0, y: 0}
        goal_pos: {x: 11, y: 0}

  #     - name: "Smaller 8x4"

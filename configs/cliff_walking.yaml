# Cliff Walking Pipeline Configuration
#
# Robot navigates a grid, avoiding a cliff to reach the goal.
# Based on the OpenAI Gymnasium Cliff Walking environment.

name: cliff_walking

synthesis:
  command: issy
  args:
    - "--tslmt"
    - "--synt"

debug: true

run_configuration:
  # Objective: Reach goal while avoiding cliff
  - objective: "F atGoal && G !onCliff"
    timeout: 1000
    configurations:
      - name: "Standard 12x4 cliff"
        grid_size: 12
        grid_rows: 4
        cliff_min: 1
        cliff_max: 10
        start_pos: {x: 0, y: 0}
        goal_pos: {x: 11, y: 0}

      - name: "Smaller 8x4"
        grid_size: 8
        grid_rows: 4
        cliff_min: 1
        cliff_max: 6
        start_pos: {x: 0, y: 0}
        goal_pos: {x: 7, y: 0}

  # Objective: Just reach goal (relaxed)
  - objective: "F atGoal"
    timeout: 1000
    configurations:
      - name: "No cliff"
        grid_size: 6
        grid_rows: 4
        cliff_min: 0
        cliff_max: 0
        start_pos: {x: 0, y: 0}
        goal_pos: {x: 5, y: 0}

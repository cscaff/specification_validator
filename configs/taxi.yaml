# Taxi Pipeline Configuration
#
# Taxi navigates a grid to pick up a passenger and deliver to destination.

name: taxi

synthesis:
  command: issy
  args:
    - "--tslmt"
    - "--synt"
    - "--pruning"
    - "1"
  timeout_minutes: 10  # Skip configuration if synthesis takes longer than 5 minutes

debug: true

run_configuration:
  - name: "4x4 compact"
    grid_size: 4
    start_pos: {x: 2, y: 2}
    pickup: {x: 0, y: 0}
    dropoff: {x: 3, y: 3}
    barriers:
      - {x: 1, y: 1}
    objectives:
      # Objective 1: Complete delivery
      - objective: "F delivered && G !atBarrier"
        timeout: 1000

  - name: "4x4 reverse route"
    grid_size: 4
    start_pos: {x: 2, y: 2}
    pickup: {x: 3, y: 3}
    dropoff: {x: 0, y: 0}
    barriers:
      - {x: 2, y: 1}
    objectives:
      # Objective 2: Same but different pickup/dropoff
      - objective: "F delivered && G !atBarrier"
        timeout: 1000
